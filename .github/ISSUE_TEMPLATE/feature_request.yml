name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow is currently difficult or unreliable?
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Desired user-visible result
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Sleep, power, privacy, or thermal implications
