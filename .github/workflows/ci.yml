name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      matrix:
        xcode: ['16.2', '16.4']
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Show Swift version
        run: swift --version

      - name: Run behavior tests
        run: swift run AgentAwakeTests

      - name: Build with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Validate shell scripts and plists
        run: |
          bash -n AppBundle/install-power-helper.sh scripts/*.sh
          plutil -lint AppBundle/*.plist
