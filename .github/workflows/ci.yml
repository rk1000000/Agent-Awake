name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Swift version
        run: swift --version

      - name: Run behavior tests
        run: swift run AgentAwakeTests

      - name: Build with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Validate shell scripts and plists
        run: |
          bash -n AppBundle/install-power-helper.sh scripts/*.sh
          plutil -lint AppBundle/*.plist
